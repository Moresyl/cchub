name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## 更新内容 / Highlights

    ### 新增 / 更新
    - 重整配置表单与模型选择面板，增加配置草稿模型测试、模型计费信息、能力筛选与供应商模型别名
    - 增加分组路由、条件预览、按账号额度筛选、账号并发与排队保护，以及余额和额度提醒
    - 完善会话搜索、压缩会话读取、删除恢复、历史迁移预览与项目档案成组切换
    - MCP 工作区按原生来源区分同名服务，展示同步归属与冲突状态；安装向导使用集中弹窗、即时校验和统一控件
    - 备份中的外部 MCP 定义进入待恢复的备份库，可复制或恢复至原始工具；本机文件归属、客户端授权和历史记录得到保留
    - 云备份支持加密与恢复密码流程；更新中英文说明及 MCP 备份库示意截图

    ### 变更与安全
    - 编辑表单默认阻止点击弹窗外部丢失草稿；保存、安装和移除期间防止重复提交，失败保留可重试的编辑内容
    - 原生配置读写检查文件身份、自定义路径、重复字段和期间的外部修改，保留未修改的注释与扩展选项
    - MCP 同步和批量导入先准备整组修改；文件或数据库提交失败时执行恢复，不将其他工具的独立同名服务视为已同步副本
    - 备份导入检查路径、快照完整性和下载大小，隔离同步账号凭据，并保留设备本地设置；不会继承外部备份的文件操作归属
    - 文件恢复用于处理本次操作返回的错误，不等同于跨进程或断电事务；不能无损转换为 JSON 的原生扩展值会拒绝 JSON 导出

    ### 问题修复与打磨
    - 修复只读代码编辑器仍可接收输入、异步刷新乱序覆盖新状态、配置复制未等待剪贴板结果等问题
    - 修复远程 MCP 服务被当作本地命令编辑的问题，分别校验服务地址、请求头、参数与环境变量；检查失败提供明确重试反馈
    - 修复云同步跨账号状态串用、过期排队任务继续执行、备份恢复失败时本地状态不一致等问题
    - 完善流式心跳、工具调用标识、推理历史、结构化响应和故障切换处理，保留原始用量并避免重复计账
    - 修复不限量额度的虚假进度、会话清理与迁移反馈、窄窗口详情和编辑区滚动问题
    - 修复设置分类滚动遮挡与切换后位置错乱、用量页间距缺失、MCP 来源标签笼统，以及 Prompt 新建表单提前报错和保存按钮不易触达的问题

    ### 安装
    - 从下方选择对应平台安装包。Windows 推荐 NSIS；也可使用 MSI。macOS 提供 Intel/Apple Silicon 包，Linux 提供 deb/AppImage。
    - 升级前建议在设置中导出备份。外部 MCP 目录条目不继承本机文件操作归属；完整备份内的工具配置和附属文件仍按完整恢复流程还原，恢复后请刷新服务列表。

    ## English Summary

    - Refines configuration/model editors, focused installation dialogs, draft protection, read-only code previews and narrow-window interactions.
    - Adds model testing and billing information, grouped and quota-aware routing, concurrency limits, account alerts and recoverable session deletion.
    - Tracks native MCP source identities and owned copies, preserves native options and comments, and checks for external changes before grouped writes.
    - Imports foreign MCP definitions into an explicit backup library while retaining local ownership, grants and history; restoration refuses existing native entries.
    - Improves encrypted cloud backup, credential isolation, restore validation and rollback, plus streaming/tool-call compatibility and usage accounting.
    - Export a backup before upgrading. Recovery handles reported operation failures; it does not promise cross-process or power-loss atomicity. README demonstration screenshots are identified as such.

    ## 下载 / Download

    | 文件 | 说明 |
    |------|------|
    | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
    | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
    | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
    | `CCHub_*_x64.dmg` | macOS Intel |
    | `CCHub_*_amd64.deb` | Linux deb 包 |
    | `CCHub_*_amd64.AppImage` | Linux AppImage |

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Report bundle sizes
        shell: pwsh
        run: |
          "## Windows bundle sizes" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 2)
              "- $($_.Name): $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY
            }

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Report bundle sizes
        run: |
          echo "## macOS bundle sizes (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path "*/bundle/*" -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Report bundle sizes
        run: |
          echo "## Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
