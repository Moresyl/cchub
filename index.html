<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCHub</title>
    <script>
      // 提前设置主题,避免 splash 与应用主题不一致导致的闪烁
      (function () {
        try {
          var saved = localStorage.getItem("cchub-theme");
          if (saved === "light" || (saved === "system" && matchMedia("(prefers-color-scheme: light)").matches)) {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #181818;
        color: #ededed;
        font-family: "CCHub Sans", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          "PingFang SC", system-ui, sans-serif;
        overflow: hidden;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #ffffff;
        color: #0a0a0a;
      }
      #root {
        height: 100%;
      }
      #cchub-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #181818;
        z-index: 9999;
        transition: opacity 180ms ease;
        will-change: opacity;
      }
      html[data-theme="light"] #cchub-splash {
        background: #ffffff;
      }
      #cchub-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 590;
        letter-spacing: 0;
        color: #ededed;
      }
      .splash-title {
        font-size: 17px;
        font-weight: 590;
        letter-spacing: 0;
        color: #ededed;
      }
      html[data-theme="light"] .splash-title {
        color: #0a0a0a;
      }
      .splash-progress {
        position: relative;
        width: 56px;
        height: 2px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }
      .splash-progress::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 18px;
        border-radius: inherit;
        background: #ededed;
        content: "";
        animation: splash-progress 1.1s ease-in-out infinite alternate;
      }
      .splash-text {
        font-size: 12px;
        color: #a3a3a3;
        letter-spacing: 0;
      }
      html[data-theme="light"] .splash-text {
        color: #737373;
      }
      html[data-theme="light"] .splash-logo {
        color: #282828;
      }
      html[data-theme="light"] .splash-progress {
        background: rgba(13, 13, 13, 0.1);
      }
      html[data-theme="light"] .splash-progress::after {
        background: #282828;
      }
      @keyframes splash-progress {
        to {
          transform: translateX(38px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-progress::after {
          animation: none;
          transform: translateX(19px);
        }
        #cchub-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="cchub-splash" role="status" aria-live="polite">
      <div class="splash-logo">CC</div>
      <div class="splash-title">CCHub</div>
      <div class="splash-progress" aria-hidden="true"></div>
      <div class="splash-text">启动中...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
