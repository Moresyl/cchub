name: Check

on:
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --check
      - name: Cargo check
        run: cargo check
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
      - name: Cargo test
        run: cargo test

  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc -b
      - name: ESLint
        run: pnpm lint
      - name: i18n key coverage
        run: pnpm i18n:key-coverage -- --strict
      - name: Vitest
        run: pnpm test
