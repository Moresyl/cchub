name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## 更新内容 / Highlights

    ### 新增 / 更新
    - 用量供应商与模型排名增加分页，超过十二条的记录可以继续查看
    - 窄区域以卡片完整展示排名指标，宽区域保留表格；长名称自动换行
    - 每日趋势限制滚动高度，摘要数字统一半粗字重
    - 更新中英文用量分析说明及实际页面组件演示截图

    ### 变更与安全
    - 用量读取失败提供本地化恢复提示，不回显内部错误
    - 刷新失败保留同一筛选下的上次成功数据，并明确提示数据尚未更新

    ### 问题修复与打磨
    - 修复快速切换筛选时旧响应覆盖当前结果，以及加载时筛选栏消失的问题
    - 合并连续用量事件，避免同一筛选重复并发刷新；离开页面后清理延迟刷新和事件监听
    - 事件监听不可用时仍可手动刷新，首次读取失败可直接重试
    - 保留较宽范围的供应商和模型选项，避免选择一项后其他选项消失；切换应用或时间范围不会沿用旧范围选项
    - 无请求的日期不再显示非零趋势条；补充响应顺序、刷新恢复、事件清理和分页回归测试

    ### 安装
    - Windows 推荐 NSIS 安装包，也可使用 MSI；macOS 提供 Intel 和 Apple Silicon，Linux 提供 deb、rpm 和 AppImage。
    - 可从应用内检查更新，或下载下方对应平台安装包。

    ## English Summary
    - Adds usage ranking pagination, compact cards for narrow panels, wrapped names and a bounded trend area.
    - Rejects stale filter responses, keeps controls available while loading, preserves broader filter choices and coalesces live refreshes.
    - Retains same-filter results after refresh failures, supports manual recovery when live updates are unavailable, and updates bilingual documentation and the screenshot.

    ## 下载 / Download

    | 文件 | 说明 |
    |------|------|
    | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
    | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
    | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
    | `CCHub_*_x64.dmg` | macOS Intel |
    | `CCHub_*_amd64.deb` | Linux deb 包 |
    | `CCHub_*_amd64.AppImage` | Linux AppImage |

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Report bundle sizes
        shell: pwsh
        run: |
          "## Windows bundle sizes" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 2)
              "- $($_.Name): $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY
            }

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Report bundle sizes
        run: |
          echo "## macOS bundle sizes (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path "*/bundle/*" -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Report bundle sizes
        run: |
          echo "## Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
