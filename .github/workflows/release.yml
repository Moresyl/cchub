name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## 更新内容 / Highlights

    ### 新增 / 更新
    - 重做 CCHub 工作区的颜色、字号、留白与信息层级，提升浅色和深色主题下的可读性
    - 折叠侧栏升级为完整图标导航，保持快速切换、全部功能入口和设置入口可直接访问
    - 配置工具筛选改为单行可滚动切换条，在窄窗口下不再堆叠成多行按钮

    ### 变更与安全
    - 配置卡片保留切换与编辑主操作，测速、流检、用量、复制和删除统一收入上下文菜单
    - 上下文菜单挂载到窗口层并根据可用空间调整方向，支持点击外部、滚动、窗口变化和 Esc 关闭
    - 清理仓库、发布说明和提交元数据中不必要的外部项目引用

    ### 问题修复
    - 修复折叠侧栏只显示 Logo、无法直接导航的问题
    - 修复配置卡片次要操作过多导致的拥挤，以及菜单可能被滚动容器裁切的问题
    - 修复移动布局重复显示页面标题的问题
    - 修复配置加载失败时直接显示底层异常文本和本机路径的问题

    ### 安装
    - 从下方选择对应平台安装包。Windows 推荐 NSIS；也可使用 MSI。macOS 提供 Intel/Apple Silicon 包，Linux 提供 deb/AppImage。
    - 从旧版升级会保留现有 CCHub 数据库和工具配置；涉及生产配置时仍建议先在设置中创建 SQL 备份。

    ## English Summary

    - Refined the CCHub workspace palette, typography, spacing, and visual hierarchy across light and dark themes.
    - Kept every navigation destination available in the collapsed icon rail and replaced wrapping tool grids with a scrollable selector.
    - Moved secondary profile operations into an accessible viewport-aware menu with reliable outside-click, scroll, resize, and Escape handling.
    - Fixed cramped profile cards, duplicate mobile headings, clipped action menus, and raw implementation errors leaking into the interface.
    - Cleaned unnecessary external project references from repository and release metadata.

    ## 下载 / Download

    | 文件 | 说明 |
    |------|------|
    | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
    | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
    | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
    | `CCHub_*_x64.dmg` | macOS Intel |
    | `CCHub_*_amd64.deb` | Linux deb 包 |
    | `CCHub_*_amd64.AppImage` | Linux AppImage |

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Report bundle sizes
        shell: pwsh
        run: |
          "## Windows bundle sizes" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 2)
              "- $($_.Name): $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY
            }

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Report bundle sizes
        run: |
          echo "## macOS bundle sizes (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path "*/bundle/*" -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Report bundle sizes
        run: |
          echo "## Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
