name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## 更新内容 / Highlights

    ### 新增 / 更新
    - 全面重构桌面工作区：采用 4px 外框间距、264px 操作侧栏和独立 12px 圆角主面板，首页不再使用贯穿式后台顶栏
    - 配置切换首页改为中央操作区，将工具选择、配置搜索、共享配置、刷新、流检和新增入口集中到同一工作流
    - 配置列表改为紧凑任务行，统一呈现工具、端点、模型、当前状态和主操作，同时保留编辑与更多操作
    - 配置编辑器改为 920px 居中工作区，增加清晰的顶栏、分段内容和固定底部操作栏

    ### 变更与安全
    - 重新定义深浅色主题的中性色阶、边框、状态色、阴影和文字层级，主按钮统一为高对比黑白样式
    - 侧栏提供后退、前进、新增和搜索入口；折叠为 52px 图标栏后仍保留全部功能导航与设置
    - 统一按钮和输入框为 8px 圆角，并恢复组件应有的内边距与焦点状态
    - 本版本不修改配置数据结构、数据库或凭据存储方式，无需迁移

    ### 问题修复与打磨
    - 修复旧的全局样式覆盖组件内边距，导致按钮文字拥挤和操作区比例失真的问题
    - 修复配置工具较多时标签换行、列表操作拥挤以及主次信息难以扫描的问题
    - 修复新增与编辑配置时表单横向铺满、底部操作不稳定和移动端双列溢出的问题
    - 完善 390px 移动布局、侧栏折叠布局和长配置列表的滚动行为

    ### 安装
    - 从下方选择对应平台安装包。Windows 推荐 NSIS；也可使用 MSI。macOS 提供 Intel/Apple Silicon 包，Linux 提供 deb/AppImage。
    - 从旧版升级会保留现有 CCHub 数据库和工具配置；涉及生产配置时建议先在设置中创建 SQL 备份。

    ## English Summary

    - Rebuilt the desktop shell around a compact action sidebar and an inset, rounded workspace panel.
    - Consolidated tool selection, search, shared profiles, health checks, creation, and switching into a focused central workflow.
    - Reworked profile rows and the full configuration editor for clearer hierarchy, denser scanning, and stable footer actions.
    - Added responsive layouts for compact windows and corrected global styles that removed component spacing.
    - No configuration database or credential-storage migration is required.

    ## 下载 / Download

    | 文件 | 说明 |
    |------|------|
    | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
    | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
    | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
    | `CCHub_*_x64.dmg` | macOS Intel |
    | `CCHub_*_amd64.deb` | Linux deb 包 |
    | `CCHub_*_amd64.AppImage` | Linux AppImage |

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Report bundle sizes
        shell: pwsh
        run: |
          "## Windows bundle sizes" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 2)
              "- $($_.Name): $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY
            }

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Report bundle sizes
        run: |
          echo "## macOS bundle sizes (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path "*/bundle/*" -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Report bundle sizes
        run: |
          echo "## Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
