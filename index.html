<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCHub</title>
    <script>
      // 提前设置主题,避免 splash 与应用主题不一致导致的闪烁
      (function () {
        try {
          var saved = localStorage.getItem("cchub-theme");
          if (saved === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0a;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #ffffff;
        color: #0a0a0a;
      }
      #root {
        height: 100%;
      }
      #cchub-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0a;
        z-index: 9999;
        transition: opacity 260ms ease;
        will-change: opacity;
      }
      html[data-theme="light"] #cchub-splash {
        background: #ffffff;
      }
      #cchub-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: linear-gradient(135deg, #fafafa 0%, #a3a3a3 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #0a0a0a;
      }
      html[data-theme="light"] .splash-logo {
        background: linear-gradient(135deg, #171717 0%, #525252 100%);
        color: #fafafa;
      }
      .splash-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #fafafa;
      }
      html[data-theme="light"] .splash-title {
        color: #0a0a0a;
      }
      .splash-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #262626;
        border-top-color: #fafafa;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
        margin-top: 4px;
      }
      html[data-theme="light"] .splash-spinner {
        border-color: #e5e5e5;
        border-top-color: #171717;
      }
      .splash-text {
        font-size: 12px;
        color: #a3a3a3;
        letter-spacing: 0.5px;
      }
      html[data-theme="light"] .splash-text {
        color: #737373;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-spinner {
          animation: none;
        }
        #cchub-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="cchub-splash" role="status" aria-live="polite">
      <div class="splash-logo">CC</div>
      <div class="splash-title">CCHub</div>
      <div class="splash-spinner" aria-hidden="true"></div>
      <div class="splash-text">启动中...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
