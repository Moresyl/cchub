name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## 更新内容 / Highlights

    ### 新增 / 更新
    - 统一桌面工作台字体：Windows 优先使用 Segoe UI Variable Text，中文回退微软雅黑 UI，代码与路径使用 Cascadia Code；启动画面和配置编辑器同步调整
    - 调整侧边栏、顶部导航、配置切换首页和设置分组的层级与间距，设置项改用更轻的分隔线布局
    - 配置切换、设置和通知中的按钮与选中状态进一步统一，保留已有的配置管理与编辑功能

    ### 变更与安全
    - 本版本仅调整桌面界面与交互，不修改数据库结构、配置格式、供应商协议或安装路径
    - README 的明暗主题工作台及配置编辑器截图已更新为原生桌面包画面，示例端点已匿名化

    ### 问题修复与打磨
    - 环境变量冲突横幅与通知改为顺序排布，避免提示覆盖页面标题和操作按钮
    - 移除技术文本中未打包字体的硬编码引用，避免不同页面退回不一致的等宽字体
    - 移除设置页重复标题，收紧部分按钮和标签状态；补充通知交互测试

    ### 安装
    - 从下方选择对应平台安装包。Windows 推荐 NSIS；也可使用 MSI。macOS 提供 Intel/Apple Silicon 包，Linux 提供 deb/AppImage。
    - 从旧版升级无需迁移数据；安装和卸载流程保持原样。

    ## English Summary

    - Aligns the desktop UI with native Windows typography and gives code, paths, and JSON a consistent monospace stack.
    - Refines the sidebar, top navigation, profile workspace, settings groups, and notification styling.
    - Keeps conflict warnings and toasts in document flow so they do not cover actions; adds toast interaction tests.
    - Refreshes anonymized desktop screenshots. Database and configuration formats are unchanged; no migration is required.

    ## 下载 / Download

    | 文件 | 说明 |
    |------|------|
    | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
    | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
    | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
    | `CCHub_*_x64.dmg` | macOS Intel |
    | `CCHub_*_amd64.deb` | Linux deb 包 |
    | `CCHub_*_amd64.AppImage` | Linux AppImage |

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Report bundle sizes
        shell: pwsh
        run: |
          "## Windows bundle sizes" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 2)
              "- $($_.Name): $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY
            }

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Report bundle sizes
        run: |
          echo "## macOS bundle sizes (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path "*/bundle/*" -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Report bundle sizes
        run: |
          echo "## Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
