name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCHub ${{ github.ref_name }}'
          releaseBody: |
            ## 更新内容 / Highlights

            - 新增 Autopilot 自动驾驶页面，支持 Claude/Codex 任务编排与自动执行
            - 大型页面拆分重构（Settings/Tools/Profiles/Marketplace → 60+ 子组件）
            - 引入 TanStack React Query 数据管理层
            - 新增 hello2cc 第三方兼容客户端插件管理
            - 新增 CommandPalette (Ctrl+K) 全局命令面板
            - 新增 ErrorBoundary 全局错误边界
            - Autopilot 停止逻辑异步化，Windows codex 兼容优化
            - 修复 Windows 下 claude-hud 多行 StatusLine 显示问题
            - Vite manualChunks 分包优化

            ## 下载 / Download

            | 文件 | 说明 |
            |------|------|
            | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
            | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
            | `CCHub_*_x64_portable.exe` | Windows 便携版 |
            | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
            | `CCHub_*_x64.dmg` | macOS Intel |
            | `CCHub_*_amd64.deb` | Linux deb 包 |
            | `CCHub_*_amd64.AppImage` | Linux AppImage |
          releaseDraft: false
          prerelease: false

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCHub ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCHub ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
