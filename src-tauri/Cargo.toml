[package]
name = "cchub"
version = "1.4.3"
edition = "2021"
description = "Claude Code ecosystem management platform"
license = "MIT"

[lib]
name = "cchub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cchub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full", "parking_lot"] }
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "http2",
] }
axum = "0.8.6"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
glob = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
thiserror = "2"
toml = "1.0.6"
toml_edit = "0.25.4"
rfd = "0.17.2"
zip = "8.2.0"
tempfile = "3.27.0"
urlencoding = "2.1.3"
flate2 = "1"
tar = "0.4"
base64 = "0.22.1"
url = "2"
serde_yaml = "0.9"
sha2 = "0.10"
keyring = "3"

[profile.dev]
# Windows/MSVC has hit intermittent linker failures with optimized dev builds
# (`anon.*.llvm.*` unresolved symbols). Keep dev codegen conservative.
opt-level = 0
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "unwind"
strip = "symbols"
incremental = false
debug = false
overflow-checks = false

# 对依赖也应用 release 优化（特别是热路径库）
[profile.release.package."*"]
opt-level = "s"
codegen-units = 1

# build script 不需要重度优化（加快冷编译）
[profile.release.build-override]
opt-level = 0
codegen-units = 256
