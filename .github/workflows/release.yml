name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCHub ${{ github.ref_name }}'
          releaseBody: |
            ## 更新内容 / Highlights

            ### 新功能
            - 应用更新自动通知 — 启动时检测新版本弹出 toast 提示，Header 可点击徽章跳转设置页
            - Marketplace 按工具分装 MCP/技能 + 精选打包一键安装
            - Autopilot 接入实时事件流 + 心跳 + 日志写入节流，消除长轮次 UI 盲区

            ### 问题修复
            - 修复 Codex CLI 审批模式/推理强度重启后被 profile 重播覆盖
            - 修复 Tools 页切换后 Codex/Claude 设置因 React Query 缓存回退
            - 修复 get_codex_settings 在 toml 1.0 下整份解析失败导致每次读取都回退默认值
            - 修复 Claude 权限级别 2（宽松）误判为级别 1（标准）
            - 修复 Claude 自动更新"禁用"选项无法持久化（改用 env.DISABLE_AUTOUPDATER 规范机制）
            - 修复技能扫描 .md 合并顺序对齐 GitHub 拉取，修正 baseline_sha256

            ### 体验优化
            - 侧边栏悬停节流 + 全局路由切换进度条
            - 统一 scan 缓存 key + 移除空闲预热
            - Toast 组件支持自定义显示时长

            ## 下载 / Download

            | 文件 | 说明 |
            |------|------|
            | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
            | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
            | `CCHub_*_x64_portable.exe` | Windows 便携版 |
            | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
            | `CCHub_*_x64.dmg` | macOS Intel |
            | `CCHub_*_amd64.deb` | Linux deb 包 |
            | `CCHub_*_amd64.AppImage` | Linux AppImage |
          releaseDraft: false
          prerelease: false

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCHub ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCHub ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
