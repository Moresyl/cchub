name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## 更新内容 / Highlights

    ### 新增 / 更新
    - 侧栏改为紧凑工作台结构：新增配置、搜索、配置文件和技能插件成为四个固定主动作，常用入口不再淹没在长菜单中
    - 新增“配置 / 运行”分段导航，根据当前工作切换客户端配置与运行分析入口，折叠后仍保留完整图标导航
    - 配置首页采用轮廓品牌标记、动态问候、状态操作条和统一搜索输入面，搜索、共享配置、刷新与新增操作集中在同一上下文
    - 工具筛选改为输入面下方的紧凑快捷项，只显示已安装或已有配置的客户端，减少无效信息并保留新增流程中的完整工具选择

    ### 变更与安全
    - 保持 4px 窗口内边距、264px 展开侧栏、52px 折叠侧栏、12px 主画布圆角和 672px 中央工作列的稳定尺寸
    - 深浅色主题增加轻量表面层级，状态条、输入面、筛选项与列表之间使用更克制的边框和明暗关系
    - 保留全部配置切换、配置编辑、共享 Provider、端点检测、用量查询和二级功能路由
    - 本版本仅调整界面结构、导航和呈现方式，不修改配置数据库、凭据存储或工具配置格式，无需迁移

    ### 问题修复与打磨
    - 修复工具筛选项超过工作列宽度时从左侧被裁切的问题，并隐藏未安装且没有配置的空筛选项
    - 修复侧栏功能平铺导致视觉拥挤、主次入口难以快速识别的问题
    - 修复状态、搜索、筛选和动作被拆成多层面板后造成的卡片堆叠与操作跳跃
    - 完善 390px 移动端顶部横向导航、工具筛选滚动、配置行换行和桌面侧栏折叠状态
    - 增加侧栏上下文切换与紧凑工具筛选测试，确保导航和配置切换交互稳定

    ### 安装
    - 从下方选择对应平台安装包。Windows 推荐 NSIS；也可使用 MSI。macOS 提供 Intel/Apple Silicon 包，Linux 提供 deb/AppImage。
    - 从旧版升级会保留现有 CCHub 数据库和工具配置；涉及生产配置时建议先在设置中创建 SQL 备份。

    ## English Summary

    - Reorganized the sidebar around four primary actions and contextual Config/Runtime navigation.
    - Refined the switching workspace with a focused status strip, unified search surface, compact tool filters, and clearer action placement.
    - Removed empty tool filters and corrected horizontal clipping while preserving all profile, provider, health-check, and editing workflows.
    - Polished collapsed-sidebar and mobile layouts, with new interaction tests for the revised navigation.
    - No configuration database or credential-storage migration is required.

    ## 下载 / Download

    | 文件 | 说明 |
    |------|------|
    | `CCHub_*_x64-setup.exe` | Windows NSIS 安装包 |
    | `CCHub_*_x64_en-US.msi` | Windows MSI 安装包 |
    | `CCHub_*_aarch64.dmg` | macOS Apple Silicon |
    | `CCHub_*_x64.dmg` | macOS Intel |
    | `CCHub_*_amd64.deb` | Linux deb 包 |
    | `CCHub_*_amd64.AppImage` | Linux AppImage |

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Report bundle sizes
        shell: pwsh
        run: |
          "## Windows bundle sizes" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Sort-Object Length -Descending |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 2)
              "- $($_.Name): $sizeMb MB" >> $env:GITHUB_STEP_SUMMARY
            }

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Report bundle sizes
        run: |
          echo "## macOS bundle sizes (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path "*/bundle/*" -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CCHub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Report bundle sizes
        run: |
          echo "## Linux bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f -print0 |
            xargs -0 ls -lh |
            awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
